<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trainify - Master cutting-edge technologies with AI-powered courses. Build real projects, earn certificates, and transform your career." />
    <title>Trainify - Learning Platform</title>
    <!-- Preconnect to backend to speed up API calls -->
    <link rel="preconnect" href="https://trainify-learning-platform.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://trainify-learning-platform.onrender.com" />
    <style>
      body {
        margin: 0;
        background: linear-gradient(135deg, #0f172a, #3b0764, #312e81);
        min-height: 100vh;
      }
      .preloader-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .loader-circle {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: #06b6d4;
        border-right-color: #a855f7;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      .preloader-text {
        color: white;
        font-size: 1.5rem;
        font-weight: 800;
        background: linear-gradient(to right, #06b6d4, #a855f7, #ec4899);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 1px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="preloader-container">
        <div class="loader-circle"></div>
        <div class="preloader-text">Trainify</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
